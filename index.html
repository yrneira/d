<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Domain Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --dark-bg: #0a0a0a;
            --card-bg: #161616;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { max-width: 1000px; width: 100%; }
        
        /* Language Selector */
        .lang-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .lang-btn {
            background: var(--card-bg);
            border: 1px solid #333;
            color: var(--text-main);
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 0.8rem;
            transition: 0.3s;
        }
        .lang-btn.active { border-color: var(--gold); color: var(--gold); }

        header { text-align: center; margin-bottom: 50px; }
        h1 { font-size: 2.2rem; margin-bottom: 10px; }
        .contact-info { color: var(--gold); font-weight: bold; }

        /* Featured 28.qa */
        .featured-card {
            background: linear-gradient(145deg, #1e1e1e, #111);
            border: 2px solid var(--gold);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.1);
        }
        .featured-name { font-size: 3.5rem; font-weight: 800; color: var(--gold); margin: 0; }
        
        /* Grid */
        .domain-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .domain-card {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .name { font-size: 1.4rem; font-weight: 700; margin-bottom: 10px; }
        
        .btn {
            display: block;
            text-align: center;
            padding: 12px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            margin-top: 15px;
        }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-outline { border: 1px solid #0084ff; color: #0084ff; }

        footer { margin-top: 60px; color: var(--text-dim); font-size: 0.8rem; text-align: center; border-top: 1px solid #333; padding-top: 20px; }
        
        [dir="rtl"] { text-align: right; }
    </style>
</head>
<body>

    <div class="container">
        <div class="lang-selector">
            <button class="lang-btn active" onclick="setLanguage('en')">English</button>
            <button class="lang-btn" onclick="setLanguage('ar')">العربية</button>
            <button class="lang-btn" onclick="setLanguage('ru')">Русский</button>
            <button class="lang-btn" onclick="setLanguage('es')">Español</button>
            <button class="lang-btn" onclick="setLanguage('zh')">中文</button>
        </div>

        <header>
            <h1 id="main-title">Premium Domain Assets</h1>
            <p class="contact-info">fromcom@yahoo.com</p>
        </header>

        <div class="featured-card" id="featured-section">
            <p id="featured-tag" class="status-tag">Exclusive Opportunity</p>
            <h2 class="featured-name">28.qa</h2>
            <p id="featured-price">Price: Inquire via Email</p>
            <p id="featured-desc" style="color: var(--text-dim); margin-bottom: 20px;">Premium 2-digit Qatar domain. Not publicly listed. Direct acquisition only.</p>
            <a href="mailto:fromcom@yahoo.com?subject=Inquiry for 28.qa" id="btn-28" class="btn btn-gold">MAKE AN OFFER</a>
        </div>

        <div class="domain-grid" id="grid">
            <!-- Content generated via JavaScript for translation -->
        </div>

        <footer id="footer-text">
            Secure transactions via Escrow. &copy; 2026 Portfolio of Richard G.
        </footer>
    </div>

    <script>
        const translations = {
            en: {
                title: "Premium Domain Assets",
                tag: "Exclusive Opportunity",
                price: "Price: Inquire via Email",
                desc: "Premium 2-digit Qatar domain. Not publicly listed. Direct acquisition only.",
                btn28: "MAKE AN OFFER",
                view: "View Listing",
                footer: "Secure transactions via Escrow. © 2026 Portfolio of Richard G.",
                dir: "ltr"
            },
            ar: {
                title: "أصول النطاقات المميزة",
                tag: "فرصة حصرية",
                price: "السعر: استفسار عبر البريد الإلكتروني",
                desc: "نطاق قطري مميز من رقمين. غير مدرج علنًا. استحواذ مباشر فقط.",
                btn28: "قدم عرضاً",
                view: "عرض القائمة",
                footer: "معاملات آمنة عبر Escrow. © 2026 محفظة ريتشارد جي.",
                dir: "rtl"
            },
            ru: {
                title: "Премиальные Доменные Активы",
                tag: "Эксклюзивная возможность",
                price: "Цена: По запросу через Email",
                desc: "Премиальный 2-значный домен Катара. Прямая продажа.",
                btn28: "СДЕЛАТЬ ПРЕДЛОЖЕНИЕ",
                view: "Посмотреть",
                footer: "Безопасные сделки через Escrow. © 2026 Портфолио Ричарда Г.",
                dir: "ltr"
            },
            es: {
                title: "Activos de Dominios Premium",
                tag: "Oportunidad Exclusiva",
                price: "Precio: Consultar por Email",
                desc: "Dominio premium de 2 dígitos en Qatar. No listado públicamente. Adquisición directa.",
                btn28: "HACER UNA OFERTA",
                view: "Ver Anuncio",
                footer: "Transacciones seguras vía Escrow. © 2026 Portafolio de Richard G.",
                dir: "ltr"
            },
            zh: {
                title: "优质域名资产",
                tag: "独家机会",
                price: "价格：通过邮件咨询",
                desc: "卡塔尔 2 位数字顶级域名。未公开列出。仅限直接收购。",
                btn28: "提交报价",
                view: "查看列表",
                footer: "通过 Escrow 进行安全交易。© 2026 Richard G. 投资组合。",
                dir: "ltr"
            }
        };

        const otherDomains = [
            "uaedr.ae", "dronescop.com", "aereogulf.com", "uaeflytaxis.ae", 
            "uaeflytaxis.com", "opsdrones.com", "flytaxis.ae", "9o32.com", 
            "x47.info", "xa94.com"
        ];

        function renderGrid(viewText) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            otherDomains.forEach(d => {
                grid.innerHTML += `
                    <div class="domain-card">
                        <div class="name">${d}</div>
                        <div class="platform-text" style="font-size:0.7rem; color:#888;">AFTERNIC / GO DADDY</div>
                        <a href="https://www.afternic.com/domain/${d}" target="_blank" class="btn btn-outline view-btn">${viewText}</a>
                    </div>
                `;
            });
        }

        function setLanguage(lang) {
            const t = translations[lang];
            document.getElementById('main-title').innerText = t.title;
            document.getElementById('featured-tag').innerText = t.tag;
            document.getElementById('featured-price').innerText = t.price;
            document.getElementById('featured-desc').innerText = t.desc;
            document.getElementById('btn-28').innerText = t.btn28;
            document.getElementById('footer-text').innerHTML = t.footer;
            
            renderGrid(t.view);
            document.body.dir = t.dir;

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.toLowerCase().includes(lang) || (lang === 'ar' && btn.innerText === 'العربية')) {
                    btn.classList.add('active');
                }
            });
        }

        // Initialize with English
        setLanguage('en');
    </script>
</body>
</html>
